<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A11B43" />
      <stop offset="50%" stop-color="#8A1538" />
      <stop offset="100%" stop-color="#580820" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="30%" stop-color="#ECD08B" />
      <stop offset="70%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#936F2C" />
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D898" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#C5A059" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#846123" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8E1D5" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle with Qatar Maroon Gradient -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#maroonGrad)" />
  
  <!-- Subtle inner gold hairline frame -->
  <rect x="5.5" y="5.5" width="117" height="117" rx="26.5" stroke="url(#goldStroke)" stroke-width="1.5" fill="none" />

  <!-- Background subtle orbital ring (representing global capital connected to Doha) -->
  <circle cx="64" cy="64" r="44" stroke="#C5A059" stroke-width="0.75" stroke-dasharray="2 3" stroke-opacity="0.3" fill="none" />

  <!-- Stylized Emblem: Interconnected "V" (Ventures) & "Q" (Qatar) & Ascending Growth Vector -->
  <g>
    <!-- Left Wing of V: Crisp Pearl White with Qatar's 9-point Serration Detail -->
    <path d="M 28 35 L 45 35 L 64 86 L 51 86 Z" fill="url(#whiteGrad)" />
    
    <!-- 3 Serrated Chevron Cuts on Left Wing (nod to Qatar Al Adaam flag) -->
    <polygon points="45,35 50.5,42.5 45,42.5" fill="#8A1538" />
    <polygon points="49.5,46.5 55,54 49.5,54" fill="#8A1538" />
    <polygon points="54,58 59.5,65.5 54,65.5" fill="#8A1538" />

    <!-- Right Wing of V: Dynamic Soaring Gold Venture Vector ascending past the horizon -->
    <path d="M 64 86 L 77 86 L 102 22 L 85 22 Z" fill="url(#goldGrad)" />

    <!-- The "Q" orbital arc sweeping through the right base, forming the complete "Q" signature -->
    <path d="M 68 80 C 82 82, 98 74, 98 55 C 98 44, 91 38, 83 38" 
          stroke="url(#goldGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          fill="none" />

    <!-- Golden Venture Star at the Q orbital zenith -->
    <g transform="translate(98, 48)">
      <polygon points="0,-8 2.2,-2.2 8,0 2.2,2.2 0,8 -2.2,2.2 -8,0 -2.2,-2.2" fill="#FFF8E0" />
      <polygon points="0,-5 1.5,-1.5 5,0 1.5,1.5 0,5 -1.5,1.5 -5,0 -1.5,-1.5" fill="#C5A059" />
    </g>

    <!-- Qatar Foundation / Doha Capital Pip -->
    <circle cx="64" cy="98" r="3.5" fill="url(#goldGrad)" />
  </g>
</svg>
